<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FAF7F0">
    <title>sunshine_log · 책을 만나는 공간</title>
    <link rel="stylesheet" href="styles.css">
    <script src="bookstores.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <h1 class="logo"><img class="logo-image" src="images/logo.png" alt="sunshine_log" width="1154" height="601"></h1>
    </header>
    <main>
      <p class="introduction">책 《엄마가 좋은 기분이에요》를 만날 수 있는 공간입니다</p>
      <section class="bookstore-grid" aria-label="책을 만날 수 있는 서점 목록"></section>
      <noscript><p class="introduction">서점 목록을 보려면 JavaScript를 활성화해 주세요.</p></noscript>
    </main>
    <dialog class="store-dialog" aria-labelledby="detail-name" aria-describedby="detail-region">
      <header class="detail-header">
        <h2 id="detail-name"></h2>
        <p id="detail-region"></p>
        <button class="detail-close" type="button" aria-label="상세 팝업 닫기"></button>
      </header>
      <section class="detail-gallery" aria-label="서점 사진">
        <img class="detail-photo" alt="">
        <p class="photo-placeholder" hidden>사진 준비 중</p>
        <button class="gallery-arrow previous" type="button" aria-label="이전 사진"></button>
        <button class="gallery-arrow next" type="button" aria-label="다음 사진"></button>
        <div class="gallery-dots" role="group" aria-label="사진 선택"></div>
        <p class="sr-only gallery-status" aria-live="polite" aria-atomic="true"></p>
      </section>
      <footer class="detail-links">
        <a class="instagram-link" target="_blank" rel="noopener noreferrer">인스타그램<span aria-hidden="true">&gt;</span></a>
        <a class="map-link" target="_blank" rel="noopener noreferrer">네이버지도<span aria-hidden="true">&gt;</span></a>
      </footer>
    </dialog>
  </body>
</html>
